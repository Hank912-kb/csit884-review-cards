<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F5F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CSIT884">
<title>CSIT884 複習卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    color-scheme:light dark;
    --paper:#F2F5F1; --card:#FFFFFF; --ink:#1D2420; --ink-soft:#586258; --ink-faint:#7A847B;
    --line:#DCE3D9; --accent:#C8891F; --accent-ink:#3E2A05; --accent-soft:#F5E3C2;
    --code:#0E7C74; --code-soft:#DCF0EC; --danger:#B8483C; --danger-soft:#F6DEDA;
    --success:#3D7A47; --success-soft:#DCEEDD;
    --shadow:0 1px 2px rgba(20,30,20,.06), 0 6px 16px rgba(20,30,20,.06);
    --hl-tag:#2563EB; --hl-attr:#B45309; --hl-str:#15803D; --hl-kw:#9333EA; --hl-fn:#0E7490;
    --hl-num:#C2410C; --hl-com:#6B7280; --hl-ent:#BE185D; --hl-op:#7A847B;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#131714; --card:#1B211D; --ink:#E9EEE7; --ink-soft:#A6B2A5; --ink-faint:#8A958A;
      --line:#2B332C; --accent:#E3A93F; --accent-ink:#1E1400; --accent-soft:#3A2C0F;
      --code:#54D2C4; --code-soft:#123330; --danger:#E2837A; --danger-soft:#3B211E;
      --success:#7FC98C; --success-soft:#1E3220;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
      --hl-tag:#7DB2FF; --hl-attr:#F0B35A; --hl-str:#7FD08F; --hl-kw:#C79BFF; --hl-fn:#5CD0E6;
      --hl-num:#FF9E7A; --hl-com:#8A95A0; --hl-ent:#FF8FB8; --hl-op:#8A958A;
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    font-size:14px; line-height:1.5;
    padding-inline:16px; padding-block:0 110px; max-width:720px; margin-inline:auto;
  }
  h1,h2,h3{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace; text-wrap:balance; margin:0}
  p{margin:0}
  pre,code,.mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,"PingFang TC",monospace}
  button{font-family:inherit; color:inherit}

  /* ---------- header ---------- */
  header.top{
    position:sticky; top:0; z-index:20; background:var(--paper);
    margin-inline:-16px; padding:calc(10px + env(safe-area-inset-top,0px)) 16px 8px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .brand h1{font-size:16px; white-space:nowrap}
  .brand .tag{font-size:11px; color:var(--ink-faint); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .mini{
    font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600; white-space:nowrap;
    padding:6px 10px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); cursor:pointer;
  }
  .mini[aria-pressed="true"]{background:var(--code); border-color:var(--code); color:#fff}
  .tabs{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs.sub{margin-top:6px}
  .tab{
    flex:0 0 auto; font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600;
    padding:7px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  .tab[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .tabs.sub .tab{font-size:11.5px; padding:5px 11px; background:transparent}
  .tabs.sub .tab[aria-selected="true"]{background:var(--code); border-color:var(--code); color:#fff}
  .tab:focus-visible,.mini:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--code); outline-offset:2px}

  main{padding-top:16px; display:flex; flex-direction:column; gap:24px}
  .intro{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; box-shadow:var(--shadow); font-size:14px; line-height:1.7; color:var(--ink-soft);
  }
  .intro b{color:var(--ink)}
  .jump{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
  .jump a{
    font-family:"IBM Plex Mono",monospace; font-size:11px; padding:4px 9px; border-radius:999px;
    background:var(--paper); border:1px solid var(--line); color:var(--ink-soft); text-decoration:none;
  }

  section.block{display:flex; flex-direction:column; gap:10px; scroll-margin-top:110px}
  .block-label{
    display:flex; align-items:center; gap:8px; font-family:"IBM Plex Mono",monospace; font-size:11px;
    letter-spacing:.05em; color:var(--ink-faint); text-transform:uppercase;
  }
  .block-label .count{background:var(--line); color:var(--ink-soft); border-radius:999px; padding:1px 8px; font-size:10px}
  .recall-hint{font-size:12px; color:var(--code); background:var(--code-soft); border-radius:8px; padding:6px 10px}
  body:not(.recall) .recall-hint{display:none}

  /* ---------- cheat sheet ---------- */
  .cheat,.cloze,.trace,.build,.mistake,.quiz{
    background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden;
  }
  .ct{
    padding:9px 14px; font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600;
    background:var(--accent-soft); color:var(--ink);
  }
  .cheat pre,.trace pre,.build pre,.cloze pre{
    margin:0; padding:12px 14px; font-size:12px; line-height:1.65; overflow-x:auto; white-space:pre; color:var(--ink);
    -webkit-overflow-scrolling:touch; tab-size:2;
  }
  .cn{padding:9px 14px; font-size:12.5px; line-height:1.65; color:var(--ink-soft); border-top:1px dashed var(--line)}
  .recall .cheat pre:not(.shown){filter:blur(7px); cursor:pointer; user-select:none; -webkit-user-select:none}

  /* ---------- flip cards ---------- */
  .card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:10px}
  .flip{perspective:1000px; cursor:pointer}
  .flip-inner{display:grid; transition:transform .45s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d}
  .flip.flipped .flip-inner{transform:rotateY(180deg)}
  .face{
    grid-area:1/1; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:14px;
    border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow);
    padding:14px; display:flex; flex-direction:column; gap:8px; min-height:118px;
  }
  .face.front .q{font-size:14px; font-weight:600; line-height:1.55; white-space:pre-wrap}
  .face.front .hint{margin-top:auto; font-size:10px; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace}
  .face.back{transform:rotateY(180deg); background:var(--code-soft); border-color:var(--code)}
  .face.back .a{font-family:"IBM Plex Mono",monospace; font-size:12px; line-height:1.6; white-space:pre-wrap; color:var(--ink); overflow-wrap:anywhere}

  /* ---------- cloze ---------- */
  .cloze pre{white-space:pre-wrap; font-size:13px; line-height:2}
  .blank{
    font-family:"IBM Plex Mono",monospace; font-size:16px; padding:0 4px; margin:0 1px; height:1.7em;
    border:1px solid var(--line); border-bottom:2px solid var(--accent); border-radius:5px;
    background:var(--paper); color:var(--ink); text-align:center; min-width:3.2ch;
  }
  .blank.ok{border-color:var(--success); background:var(--success-soft)}
  .blank.bad{border-color:var(--danger); background:var(--danger-soft)}
  .blank.shown{border-color:var(--code); background:var(--code-soft)}
  .bar{display:flex; align-items:center; gap:8px; padding:9px 14px; border-top:1px dashed var(--line); flex-wrap:wrap}
  .btn{
    font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:600; padding:7px 12px; border-radius:9px;
    border:1px solid var(--line); background:var(--paper); color:var(--ink-soft); cursor:pointer;
  }
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .bar .res{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-soft)}
  .bar .res.good{color:var(--success)}

  /* ---------- mistakes ---------- */
  .mistake .row{padding:12px 14px; display:flex; gap:10px; align-items:flex-start}
  .mistake .row.wrong{background:var(--danger-soft)}
  .mistake .row.right{background:var(--success-soft)}
  .mistake .mark{font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:12px; flex:0 0 auto; margin-top:1px}
  .mistake .row.wrong .mark{color:var(--danger)}
  .mistake .row.right .mark{color:var(--success)}
  .mistake pre{font-size:12px; line-height:1.6; white-space:pre-wrap; word-break:break-word; margin:0; min-width:0}

  /* ---------- trace / build ---------- */
  .trace pre,.build .task{border-bottom:1px solid var(--line)}
  .tq{padding:10px 14px 4px; font-size:13.5px; font-weight:600; line-height:1.6; white-space:pre-wrap}
  .build .task{padding:12px 14px; font-size:13.5px; font-weight:600; line-height:1.65; white-space:pre-wrap; background:var(--paper)}
  .ans{padding:4px 14px 12px; font-size:13px; line-height:1.7; color:var(--ink)}
  .ans .a{font-family:"IBM Plex Mono",monospace; font-size:12.5px; white-space:pre-wrap; background:var(--code-soft); border-radius:8px; padding:8px 10px; margin-bottom:6px}
  .ans .why{color:var(--ink-soft); font-size:12.5px; white-space:pre-wrap}
  .ans ol{margin:6px 0 8px; padding-left:20px; color:var(--ink)}
  .ans li{margin:2px 0}
  .trace .bar,.build .bar{border-top:none; padding-top:4px}
  .ans pre{margin:0; padding:10px 12px; background:var(--code-soft); border-radius:8px; font-size:12px}

  /* ---------- quiz (topic page) ---------- */
  .quiz{padding:14px; display:flex; flex-direction:column; gap:16px}
  .quiz-q{display:flex; flex-direction:column; gap:8px}
  .qtext{font-size:13.5px; font-weight:600; line-height:1.55; white-space:pre-wrap}
  .opt{
    text-align:left; font-size:12.5px; padding:9px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink); cursor:pointer; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere;
    font-family:"IBM Plex Mono",monospace;
  }
  .opt.correct{background:var(--success-soft); border-color:var(--success); font-weight:600}
  .opt.wrong{background:var(--danger-soft); border-color:var(--danger)}
  .opt[disabled]{cursor:default}
  .explain{font-size:12px; color:var(--ink-soft); background:var(--paper); border-radius:8px; padding:8px 10px; display:none; line-height:1.6}
  .explain.show{display:block}
  .quiz-score{
    display:flex; align-items:center; justify-content:space-between; font-family:"IBM Plex Mono",monospace; font-size:12px;
    padding-top:10px; border-top:1px solid var(--line); color:var(--ink-soft);
  }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:30;
    font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:13px;
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:999px;
    padding:13px 18px; box-shadow:var(--shadow); cursor:pointer;
  }

  /* ---------- overlay ---------- */
  .overlay{
    position:fixed; inset:0; z-index:50; background:var(--paper); display:flex; flex-direction:column;
    padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));
    max-width:720px; margin-inline:auto;
  }
  .overlay-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px}
  .modes{display:flex; gap:6px}
  .close{font-family:"IBM Plex Mono",monospace; font-size:12px; background:var(--card); border:1px solid var(--line); color:var(--ink-soft); border-radius:8px; padding:6px 10px; cursor:pointer}
  .chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none; flex:0 0 auto}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; font-family:"IBM Plex Mono",monospace; font-size:11px; padding:5px 10px; border-radius:999px;
    border:1px solid var(--line); background:var(--card); color:var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  .chip[aria-pressed="true"]{background:var(--code); border-color:var(--code); color:#fff}
  .deck-wrap{flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px}
  .progress{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-faint); display:flex; gap:10px; align-items:center}
  .progress .weak-badge{color:var(--danger); font-weight:600}
  .deck-flip{width:100%; max-width:440px; flex:1; min-height:0; max-height:460px; perspective:1200px}
  .deck-inner{position:relative; width:100%; height:100%; transition:transform .45s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d; cursor:pointer}
  .deck-flip.flipped .deck-inner{transform:rotateY(180deg)}
  .deck-face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:18px;
    border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow); padding:20px; display:flex; flex-direction:column;
    gap:10px; overflow-y:auto;
  }
  .deck-face>:first-child{margin-top:auto}
  .deck-face>:last-child{margin-bottom:auto}
  .deck-face .kind{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent)}
  .deck-face .body{font-size:16px; font-weight:600; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere}
  .deck-face .body.code{font-family:"IBM Plex Mono",monospace; font-size:12.5px; font-weight:400; line-height:1.65}
  .deck-face.back{transform:rotateY(180deg); background:var(--code-soft); border-color:var(--code)}
  .deck-face.back .body{font-family:"IBM Plex Mono",monospace; font-size:13px; font-weight:400}
  .deck-face .note{font-size:12px; color:var(--ink-soft); border-top:1px dashed var(--line); padding-top:8px; white-space:pre-wrap; line-height:1.6}
  .deck-controls{display:flex; align-items:stretch; gap:8px; width:100%; max-width:440px}
  .deck-controls button{
    flex:1; font-family:"IBM Plex Mono",monospace; font-size:12.5px; font-weight:600; border:1px solid var(--line); background:var(--card);
    color:var(--ink); border-radius:12px; padding:12px 6px; cursor:pointer; white-space:nowrap;
  }
  .deck-controls button.weak{color:var(--danger); border-color:var(--danger)}
  .deck-controls button.know{color:var(--success); border-color:var(--success)}
  .deck-controls button.nav{flex:0 0 52px}
  .shuf{font-family:"IBM Plex Mono",monospace; font-size:11px; padding:4px 9px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); cursor:pointer}

  .quiz-wrap{flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding-bottom:8px}
  .quiz-wrap .qcard{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:16px; display:flex; flex-direction:column; gap:10px}
  .quiz-wrap .qmeta{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-faint)}
  .quiz-wrap .qtext{font-size:15px}
  .quiz-wrap .opt{font-size:13px}
  .wrong-item{font-size:12.5px; line-height:1.6; padding:10px 12px; background:var(--danger-soft); border-radius:10px}
  .wrong-item b{display:block; margin-bottom:2px}
  .score-big{font-family:"IBM Plex Mono",monospace; font-size:28px; font-weight:700; text-align:center; padding:8px 0}


  /* ---------- syntax highlighting ---------- */
  .hl-tag{color:var(--hl-tag)}
  .hl-attr{color:var(--hl-attr)}
  .hl-str{color:var(--hl-str)}
  .hl-kw,.hl-decl{color:var(--hl-kw)}
  .hl-fn,.hl-bi,.hl-prop{color:var(--hl-fn)}
  .hl-num{color:var(--hl-num)}
  .hl-ent{color:var(--hl-ent)}
  .hl-com{color:var(--hl-com); font-style:italic}
  .hl-op{color:var(--hl-op)}
  .hl-note{color:var(--ink-soft); font-family:"IBM Plex Sans","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; font-size:.94em}
  .hl-kw,.hl-fn{font-weight:500}
  .ph{color:var(--ink-faint); letter-spacing:.05em}
  .nohl [class^="hl-"]{color:inherit!important; font-style:normal!important; font-weight:inherit!important; font-family:inherit!important; font-size:inherit!important}
  .legend{display:flex; flex-wrap:wrap; gap:4px 12px; font-family:"IBM Plex Mono",monospace; font-size:11px; padding:8px 12px; background:var(--card); border:1px solid var(--line); border-radius:10px}
  body.nohl .legend{display:none}

  @media (prefers-reduced-motion: reduce){ .flip-inner,.deck-inner{transition:none} }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>CSIT884 複習卡</h1>
    <span class="tag">HTML · CSS · JS · 表單 · XML</span>
    <button class="mini" id="hlBtn" type="button" aria-pressed="true" aria-label="切換語法上色" title="語法上色 開/關">🎨</button>
    <button class="mini" id="recallBtn" type="button" aria-pressed="false" title="遮住速查表的程式碼，先回想再點開看答案">🙈 默背</button>
  </div>
  <div class="tabs" id="groups" role="tablist" aria-label="大單元"></div>
  <div class="tabs sub" id="tabs" role="tablist" aria-label="小單元"></div>
</header>

<main id="main"></main>

<button class="fab" id="fabShuffle" type="button">🔀 隨機複習</button>

<div class="overlay" id="overlay" hidden>
  <div class="overlay-head">
    <div class="modes">
      <button class="mini" id="modeCards" type="button" aria-pressed="true">卡片</button>
      <button class="mini" id="modeQuiz" type="button" aria-pressed="false">選擇題</button>
    </div>
    <button class="close" id="closeOverlay" type="button">離開 ✕</button>
  </div>
  <div class="chips" id="chips"></div>

  <div class="deck-wrap" id="cardView">
    <div class="progress"><span id="progress">1 / 1</span><span class="weak-badge" id="weakBadge" hidden>不熟</span><button class="shuf" id="shuffleBtn" type="button">🔀 洗牌</button></div>
    <div class="deck-flip" id="deckFlip">
      <div class="deck-inner" id="deckInner">
        <div class="deck-face front">
          <div class="kind" id="deckKindFront"></div>
          <div class="body" id="deckFrontBody"></div>
        </div>
        <div class="deck-face back">
          <div class="kind" id="deckKindBack"></div>
          <div class="body" id="deckBackBody"></div>
          <div class="note" id="deckNote" hidden></div>
        </div>
      </div>
    </div>
    <div class="deck-controls">
      <button class="nav" id="prevBtn" type="button" aria-label="上一張">←</button>
      <button class="weak" id="weakBtn" type="button">✗ 不熟</button>
      <button class="know" id="knowBtn" type="button">✓ 會了</button>
      <button class="nav" id="nextBtn" type="button" aria-label="下一張">→</button>
    </div>
  </div>

  <div class="quiz-wrap" id="quizView" hidden></div>
</div>

<script src="hl.js?v=4"></script>
<script src="data/html.js?v=4"></script>
<script src="data/css.js?v=4"></script>
<script src="data/js1.js?v=4"></script>
<script src="data/js2.js?v=4"></script>
<script src="data/form.js?v=4"></script>
<script src="data/xml.js?v=4"></script>
<script src="data/compare.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
