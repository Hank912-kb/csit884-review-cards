<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CSIT884 複習卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#F2F5F1;
    --card:#FFFFFF;
    --ink:#1D2420;
    --ink-soft:#586258;
    --ink-faint:#8A938B;
    --line:#DCE3D9;
    --accent:#C8891F;
    --accent-ink:#3E2A05;
    --accent-soft:#F5E3C2;
    --code:#0E7C74;
    --code-soft:#DCF0EC;
    --danger:#B8483C;
    --danger-soft:#F6DEDA;
    --success:#3D7A47;
    --success-soft:#DCEEDD;
    --shadow: 0 1px 2px rgba(20,30,20,.06), 0 6px 16px rgba(20,30,20,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#131714;
      --card:#1B211D;
      --ink:#E9EEE7;
      --ink-soft:#A6B2A5;
      --ink-faint:#6C766B;
      --line:#2B332C;
      --accent:#E3A93F;
      --accent-ink:#1E1400;
      --accent-soft:#3A2C0F;
      --code:#54D2C4;
      --code-soft:#123330;
      --danger:#E2837A;
      --danger-soft:#3B211E;
      --success:#7FC98C;
      --success-soft:#1E3220;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#131714;
    --card:#1B211D;
    --ink:#E9EEE7;
    --ink-soft:#A6B2A5;
    --ink-faint:#6C766B;
    --line:#2B332C;
    --accent:#E3A93F;
    --accent-ink:#1E1400;
    --accent-soft:#3A2C0F;
    --code:#54D2C4;
    --code-soft:#123330;
    --danger:#E2837A;
    --danger-soft:#3B211E;
    --success:#7FC98C;
    --success-soft:#1E3220;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding-inline:16px;
    padding-block:14px 96px;
    max-width:640px;
    margin-inline:auto;
  }
  h1,h2,h3{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace; text-wrap:balance; margin:0}
  code, .mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace}
  p{margin:0}

  header.top{
    position:sticky; top:env(safe-area-inset-top,0px);
    z-index:20; background:var(--paper);
    padding-block:10px 8px; margin-inline:-16px; padding-inline:16px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:baseline; gap:8px; margin-bottom:10px}
  .brand h1{font-size:17px; color:var(--ink)}
  .brand .tag{font-size:11px; color:var(--ink-faint); font-family:"IBM Plex Sans"}
  .tabs{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto; font-family:"IBM Plex Mono"; font-size:12px; font-weight:600;
    padding:7px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  .tab[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .tab:focus-visible{outline:2px solid var(--code); outline-offset:2px}

  main{padding-top:16px; display:flex; flex-direction:column; gap:22px}

  .intro{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; box-shadow:var(--shadow); font-size:14px; line-height:1.65; color:var(--ink-soft);
  }
  .intro b{color:var(--ink)}

  section.block{display:flex; flex-direction:column; gap:10px}
  .block-label{
    display:flex; align-items:center; gap:8px; font-family:"IBM Plex Mono"; font-size:11px;
    letter-spacing:.06em; color:var(--ink-faint); text-transform:uppercase;
  }
  .block-label .count{
    background:var(--line); color:var(--ink-soft); border-radius:999px; padding:1px 8px; font-size:10px;
  }

  /* flashcards */
  .card-row{display:flex; gap:10px; overflow-x:auto; padding:4px 2px 10px; scroll-snap-type:x proximity}
  .flip{
    flex:0 0 auto; width:230px; height:150px; perspective:1000px; scroll-snap-align:start;
  }
  .flip-inner{
    position:relative; width:100%; height:100%; transition:transform .5s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d; cursor:pointer;
  }
  .flip.flipped .flip-inner{transform:rotateY(180deg)}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:14px;
    border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow);
    padding:14px; display:flex; flex-direction:column; justify-content:center; gap:6px;
  }
  .face.front .q{font-size:14px; font-weight:600; line-height:1.45}
  .face.front .hint{margin-top:auto; font-size:10px; color:var(--ink-faint); font-family:"IBM Plex Mono"}
  .face.back{
    transform:rotateY(180deg); background:var(--code-soft); border-color:var(--code);
  }
  .face.back .a{font-family:"IBM Plex Mono"; font-size:12.5px; line-height:1.55; white-space:pre-wrap; color:var(--ink); overflow-y:auto}

  /* mistake card */
  .mistake{
    background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
    overflow:hidden;
  }
  .mistake .row{padding:12px 14px; display:flex; gap:10px; align-items:flex-start}
  .mistake .row.wrong{background:var(--danger-soft)}
  .mistake .row.right{background:var(--success-soft)}
  .mistake .mark{font-family:"IBM Plex Mono"; font-weight:700; font-size:12px; flex:0 0 auto; margin-top:1px}
  .mistake .row.wrong .mark{color:var(--danger)}
  .mistake .row.right .mark{color:var(--success)}
  .mistake pre{font-family:"IBM Plex Mono"; font-size:12px; line-height:1.55; white-space:pre-wrap; word-break:break-word; margin:0}
  .mistake .note{padding:11px 14px; font-size:12.5px; line-height:1.6; color:var(--ink-soft); border-top:1px dashed var(--line)}

  /* quiz */
  .quiz{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:14px; display:flex; flex-direction:column; gap:12px}
  .quiz-q{display:flex; flex-direction:column; gap:8px}
  .quiz-q .qtext{font-size:13.5px; font-weight:600; line-height:1.5}
  .opt{
    text-align:left; font-size:13px; padding:9px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink); cursor:pointer; font-family:inherit; line-height:1.5;
  }
  .opt:focus-visible{outline:2px solid var(--code); outline-offset:1px}
  .opt.correct{background:var(--success-soft); border-color:var(--success); font-weight:600}
  .opt.wrong{background:var(--danger-soft); border-color:var(--danger)}
  .opt[disabled]{cursor:default}
  .explain{font-size:12px; color:var(--ink-soft); background:var(--paper); border-radius:8px; padding:8px 10px; display:none}
  .explain.show{display:block}
  .quiz-score{
    display:flex; align-items:center; justify-content:space-between; font-family:"IBM Plex Mono"; font-size:12px;
    padding-top:8px; border-top:1px solid var(--line); color:var(--ink-soft);
  }
  .quiz-score button{
    font-family:"IBM Plex Mono"; font-size:11px; border:1px solid var(--line); background:var(--paper);
    color:var(--ink-soft); border-radius:8px; padding:5px 10px; cursor:pointer;
  }

  svg.diagram{width:100%; height:auto; margin-top:2px}
  .diagram text{font-family:"IBM Plex Mono"; fill:var(--ink-soft)}
  .diagram .accent-fill{fill:var(--accent-soft); stroke:var(--accent)}
  .diagram .code-fill{fill:var(--code-soft); stroke:var(--code)}
  .diagram .line{stroke:var(--ink-faint)}

  /* shuffle FAB + overlay */
  .fab{
    position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px));
    z-index:30; font-family:"IBM Plex Mono"; font-weight:700; font-size:13px;
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:999px;
    padding:13px 18px; box-shadow:var(--shadow); cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .overlay{
    position:fixed; inset:0; z-index:50; background:var(--paper);
    display:flex; flex-direction:column; padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));
  }
  .overlay-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
  .overlay-head h2{font-size:15px}
  .overlay-head button.close{
    font-family:"IBM Plex Mono"; font-size:12px; background:var(--card); border:1px solid var(--line);
    color:var(--ink-soft); border-radius:8px; padding:6px 10px; cursor:pointer;
  }
  .chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; font-family:"IBM Plex Mono"; font-size:11px; padding:5px 10px; border-radius:999px;
    border:1px solid var(--line); background:var(--card); color:var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  .chip[aria-pressed="true"]{background:var(--code); border-color:var(--code); color:#fff}
  .deck-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; min-height:0}
  .progress{font-family:"IBM Plex Mono"; font-size:12px; color:var(--ink-faint)}
  .deck-flip{width:100%; max-width:380px; height:min(46vh,300px); perspective:1200px}
  .deck-inner{position:relative; width:100%; height:100%; transition:transform .45s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d; cursor:pointer}
  .deck-flip.flipped .deck-inner{transform:rotateY(180deg)}
  .deck-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; border:1px solid var(--line);
    background:var(--card); box-shadow:var(--shadow); padding:22px; display:flex; flex-direction:column;
    justify-content:center; gap:10px; overflow-y:auto;
  }
  .deck-face .kind{font-family:"IBM Plex Mono"; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent)}
  .deck-face .body{font-size:16px; font-weight:600; line-height:1.5}
  .deck-face.back{transform:rotateY(180deg); background:var(--code-soft); border-color:var(--code)}
  .deck-face.back .body{font-family:"IBM Plex Mono"; font-size:13.5px; font-weight:400; white-space:pre-wrap}
  .deck-face .note{font-size:12px; color:var(--ink-soft); font-family:"IBM Plex Sans"; border-top:1px dashed var(--line); padding-top:8px; margin-top:4px}
  .deck-controls{display:flex; align-items:center; gap:14px}
  .deck-controls button{
    font-family:"IBM Plex Mono"; font-size:13px; border:1px solid var(--line); background:var(--card);
    color:var(--ink); border-radius:12px; padding:11px 16px; cursor:pointer;
  }
  .deck-controls button.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700}
  .deck-controls button:focus-visible{outline:2px solid var(--code); outline-offset:2px}

  @media (prefers-reduced-motion: reduce){
    .flip-inner, .deck-inner{transition:none}
  }
</style>

<header class="top">
  <div class="brand">
    <h1>CSIT884 複習卡</h1>
    <span class="tag mono">HTML · CSS · JS · XML/XSD</span>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
</header>

<main id="main"></main>

<button class="fab" id="fabShuffle" type="button">🔀 隨機複習</button>

<div class="overlay" id="overlay" hidden>
  <div class="overlay-head">
    <h2 class="mono">隨機複習</h2>
    <button class="close" id="closeOverlay" type="button">離開 ✕</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="deck-wrap">
    <div class="progress" id="progress">1 / 1</div>
    <div class="deck-flip" id="deckFlip">
      <div class="deck-inner" id="deckInner">
        <div class="deck-face front">
          <div class="kind" id="deckKindFront"></div>
          <div class="body" id="deckFrontBody"></div>
        </div>
        <div class="deck-face back">
          <div class="kind" id="deckKindBack"></div>
          <div class="body" id="deckBackBody"></div>
          <div class="note" id="deckNote" hidden></div>
        </div>
      </div>
    </div>
    <div class="deck-controls">
      <button id="prevBtn" type="button">← 上一張</button>
      <button id="shuffleBtn" class="primary" type="button">🔀 洗牌</button>
      <button id="nextBtn" type="button">下一張 →</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

var TOPICS = [
  {id:"html", name:"HTML"},
  {id:"css", name:"CSS"},
  {id:"jsbasic", name:"JS 基礎"},
  {id:"jsevent", name:"JS 事件"},
  {id:"form", name:"表單驗證"},
  {id:"anim", name:"動畫效果"},
  {id:"xml", name:"XML/DTD"},
  {id:"xsd", name:"XSD"}
];

var DATA = {
  html:{
    intro:"HTML 用標籤 (tag) 描述網頁內容,大多數標籤都是成對出現：開始標籤配一個一模一樣名稱的結束標籤。",
    cards:[
      {q:"一份 HTML 文件最基本的骨架長什麼樣？", a:"<html>\n <head>\n  <title>Hi</title>\n </head>\n <body>\n  Hello World!\n </body>\n</html>"},
      {q:"沒有內容的空元素 (empty element) 怎麼寫？", a:"用自我封閉標籤：\n<br />\n<hr />\n<img src=\"cat.png\" alt=\"貓\" />"},
      {q:"屬性 (attribute) 的寫法規則？", a:"寫在開始標籤裡\nname=\"value\"\n<img src=\"a.png\" alt=\"說明\" />"},
      {q:"& < > 這些保留字元怎麼顯示在畫面上？", a:"用字元實體：\n&lt;  →  <\n&gt;  →  >\n&amp; →  &\n&nbsp; → 不斷行空格"}
    ],
    mistakes:[
      {wrong:"<P>a paragraph\n<br>\n<img src=\"logo.png\">", right:"<p>a paragraph</p>\n<br />\n<img src=\"logo.png\" />", note:"HTML5 瀏覽器雖然容錯,但考試常考 XHTML 規則：標籤要小寫、一定要正確關閉、屬性值要加引號。"}
    ],
    quiz:[
      {q:"下面哪一個是正確的自我封閉標籤寫法？", opts:["<br/>","<BR>","<br></br>","<br sp>"], correct:0, explain:"自我封閉標籤用 /> 結尾,依 XHTML 規則標籤名稱要小寫。"},
      {q:"<ol> 和 <ul> 的差別是？", opts:["ol 是有序清單,ul 是無序清單","ol 是無序清單,ul 是有序清單","兩者完全一樣","ol 只能放在表格裡"], correct:0, explain:"ol = ordered list(有編號),ul = unordered list(項目符號)。"},
      {q:"要讓瀏覽器把 < 印出來而不是當成標籤解析,要用？", opts:["&lt;","&amp;","雙引號括起來","反斜線 \\<"], correct:0, explain:"< 是保留字元,必須用字元實體 &lt; 取代。"}
    ]
  },
  css:{
    intro:"CSS 決定網頁的外觀。三種套用方式的優先權：inline（行內）最高，其次是 document（內部 &lt;style&gt;），external（外部檔案）最低。",
    diagram:'<svg class="diagram" viewBox="0 0 300 92"><rect class="accent-fill" x="4" y="8" width="292" height="22" rx="6"/><text x="150" y="23" text-anchor="middle" font-size="11">inline style="..." 優先權最高</text><rect class="code-fill" x="24" y="36" width="252" height="22" rx="6"/><text x="150" y="51" text-anchor="middle" font-size="11">document &lt;style&gt;...&lt;/style&gt;</text><rect x="44" y="64" width="212" height="22" rx="6" fill="none" class="line" stroke-width="1.4"/><text x="150" y="79" text-anchor="middle" font-size="11">external .css 檔案 優先權最低</text></svg>',
    cards:[
      {q:"三種加入 CSS 的方式？", a:"1) inline：style=\"...\" 屬性\n2) document：<style> 寫在 <head>\n3) external：<link rel=\"stylesheet\" href=\"x.css\">"},
      {q:"class selector 跟 id selector 符號差在哪？", a:"class 用 . 開頭\n.userInfo{...}\n\nid 用 # 開頭\n#userHeading{...}\n(id 在同一頁應該唯一)"},
      {q:"「E 的所有子孫 F」跟「E 的直接子元素 F」怎麼分？", a:"子孫(不管隔幾層)：\nE F { ... }\n\n只限直接子元素：\nE > F { ... }"},
      {q:"連結的四種偽類 (pseudo-class) 常見寫法？", a:"a:link{...}   未拜訪過\na:visited{...} 拜訪過\nh1:hover{...}  滑鼠移上去"}
    ],
    mistakes:[
      {wrong:"p {\n border:1px solid black,\n padding:10px\n}", right:"p {\n border:1px solid black;\n padding:10px;\n}", note:"CSS 宣告之間要用分號 ; 隔開,不是逗號。少一個分號,後面的屬性常常直接失效。"}
    ],
    quiz:[
      {q:"三種 CSS 優先順序由高到低排列？", opts:["inline > document > external","external > document > inline","document > inline > external","三者一樣高,看誰先寫"], correct:0, explain:"離元素越近優先權越高：inline 最高,external 最低。"},
      {q:".eticket 這個 selector 選到的是？", opts:["class=\"eticket\" 的所有元素","id=\"eticket\" 的元素","標籤名稱叫 eticket 的元素","這是無效語法"], correct:0, explain:". 開頭代表 class selector。"},
      {q:"div i { color:red; } 這個 contextual selector 選到什麼？", opts:["div 裡面所有的 i 子孫元素","只有 div 直接底下的 i 子元素","頁面上所有 i 元素","只有 class 叫 div 的 i 元素"], correct:0, explain:"中間用空白代表「子孫」,不限層數;若只要直接子元素要用 >。"}
    ]
  },
  jsbasic:{
    intro:"JS 用 var 宣告變數,型別是動態的（同一個變數可以先後裝不同型別）,陳述句用分號結尾。",
    diagram:'<svg class="diagram" viewBox="0 0 300 78"><rect class="accent-fill" x="4" y="6" width="88" height="30" rx="6"/><text x="48" y="25" text-anchor="middle" font-size="10">① 給 id</text><rect class="code-fill" x="106" y="6" width="120" height="30" rx="6"/><text x="166" y="20" text-anchor="middle" font-size="9">② getElementById</text><text x="166" y="31" text-anchor="middle" font-size="9">("id")</text><rect x="240" y="6" width="56" height="30" rx="6" fill="none" class="line" stroke-width="1.4"/><text x="268" y="25" text-anchor="middle" font-size="10">③ 改值</text><path class="line" d="M94 21 H104 M228 21 H238" stroke-width="1.4" marker-end="url(#arr)"/><text x="48" y="58" text-anchor="middle" font-size="9" fill="var(--ink-faint)">html 加 id</text><text x="166" y="58" text-anchor="middle" font-size="9" fill="var(--ink-faint)">var e = ...</text><text x="268" y="58" text-anchor="middle" font-size="9" fill="var(--ink-faint)">e.innerHTML</text></svg>',
    cards:[
      {q:"宣告變數但沒給值,它的值是什麼？", a:"undefined\n\nvar x;\nalert(x); // undefined"},
      {q:"== 是比較還是賦值？", a:"== 是「比較是否相等」\n= 才是「賦值」\n\nif (x == 5) { ... }  ✓\nif (x = 5)  { ... }  ✗ 危險!"},
      {q:"數字加字串會發生什麼事？", a:"從左到右運算,遇到字串\n整段變成字串串接：\n\n2016 + \"Wollongong\"\n→ \"2016Wollongong\""},
      {q:"用 JS 改畫面內容的三個步驟？", a:"① 給 HTML 元素一個 id\n② var e=document.getElementById(\"id\")\n③ e.innerHTML=\"新內容\"\n  (輸入框用 e.value,圖片用 e.src)"}
    ],
    mistakes:[
      {wrong:"if (x = 5) {\n  alert(\"x is 5\");\n}", right:"if (x == 5) {\n  alert(\"x is 5\");\n}", note:"= 是賦值,== 才是比較。Python 轉 JS 常在寫 if 判斷式時手滑漏打一個等號,這個錯誤不會報錯,還會讓判斷式永遠成立,很難察覺。"}

/* ---------- render topic tabs ---------- */
var tabsEl = document.getElementById("tabs");
TOPICS.forEach(function(t, i){
  var b = document.createElement("button");
  b.className = "tab mono"; b.type = "button"; b.role = "tab";
  b.setAttribute("aria-selected", i === 0 ? "true" : "false");
  b.textContent = t.name;
  b.addEventListener("click", function(){ selectTopic(t.id); });
  b.id = "tab-" + t.id;
  tabsEl.appendChild(b);
});

function el(tag, cls, html){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function selectTopic(id){
  TOPICS.forEach(function(t){
    document.getElementById("tab-" + t.id).setAttribute("aria-selected", t.id === id ? "true" : "false");
  });
  renderMain(id);
  window.scrollTo({top:0, behavior:"smooth"});
}

function renderMain(id){
  var d = DATA[id];
  var main = document.getElementById("main");
  main.innerHTML = "";

  var intro = el("div", "intro");
  intro.innerHTML = "<b>重點：</b>" + d.intro + (d.diagram || "");
  main.appendChild(intro);

  var cardSec = el("section", "block");
  cardSec.appendChild(el("div", "block-label", "語法卡（點一下翻面）<span class=\"count\">" + d.cards.length + "</span>"));
  var row = el("div", "card-row");
  d.cards.forEach(function(c){
    var fc = el("div", "flip");
    fc.innerHTML =
      '<div class="flip-inner">' +
        '<div class="face front"><div class="q">' + escapeHtml(c.q) + '</div><div class="hint">點一下看語法 →</div></div>' +
        '<div class="face back"><div class="a">' + escapeHtml(c.a) + '</div></div>' +
      '</div>';
    fc.addEventListener("click", function(){ fc.classList.toggle("flipped"); });
    row.appendChild(fc);
  });
  cardSec.appendChild(row);
  main.appendChild(cardSec);

  if (d.mistakes && d.mistakes.length){
    var mSec = el("section", "block");
    mSec.appendChild(el("div", "block-label", "常見錯誤 · Wrong → Right<span class=\"count\">" + d.mistakes.length + "</span>"));
    d.mistakes.forEach(function(m){
      var card = el("div", "mistake");
      card.innerHTML =
        '<div class="row wrong"><span class="mark">✕</span><pre>' + escapeHtml(m.wrong) + '</pre></div>' +
        '<div class="row right"><span class="mark">✓</span><pre>' + escapeHtml(m.right) + '</pre></div>' +
        '<div class="note">' + m.note + '</div>';
      mSec.appendChild(card);
    });
    main.appendChild(mSec);
  }

  var qSec = el("section", "block");
  qSec.appendChild(el("div", "block-label", "小考 · 三題<span class=\"count\">" + d.quiz.length + "</span>"));
  var quizBox = el("div", "quiz");
  var answered = 0, correctCount = 0;
  var scoreRow = el("div", "quiz-score");
  function updateScore(){
    scoreRow.querySelector(".s").textContent = answered + " / " + d.quiz.length + " 已作答　正確 " + correctCount;
  }
  d.quiz.forEach(function(q, qi){
    var qBlock = el("div", "quiz-q");
    qBlock.appendChild(el("div", "qtext", (qi+1) + ". " + escapeHtml(q.q)));
    var done = false;
    q.opts.forEach(function(opt, oi){
      var btn = el("button", "opt mono", null);
      btn.type = "button"; btn.textContent = opt;
      btn.addEventListener("click", function(){
        if (done) return;
        done = true; answered++;
        var buttons = qBlock.querySelectorAll(".opt");
        buttons.forEach(function(bb, bi){
          bb.disabled = true;
          if (bi === q.correct) bb.classList.add("correct");
        });
        if (oi === q.correct){ correctCount++; }
        else { btn.classList.add("wrong"); }
        qBlock.querySelector(".explain").classList.add("show");
        updateScore();
      });
      qBlock.appendChild(btn);
    });
    var ex = el("div", "explain", "💡 " + q.explain);
    qBlock.appendChild(ex);
    quizBox.appendChild(qBlock);
  });
  scoreRow.innerHTML = '<span class="s">0 / ' + d.quiz.length + ' 已作答</span>';
  var resetBtn = el("button", null, "重來");
  resetBtn.type = "button";
  resetBtn.addEventListener("click", function(){ renderMain(id); });
  scoreRow.appendChild(resetBtn);
  quizBox.appendChild(scoreRow);
  qSec.appendChild(quizBox);
  main.appendChild(qSec);
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

selectTopic(TOPICS[0].id);

/* ---------- shuffle review overlay ---------- */
var deck = [];
TOPICS.forEach(function(t){
  var d = DATA[t.id];
  d.cards.forEach(function(c){
    deck.push({topic:t.id, topicName:t.name, kind:"語法卡", front:c.q, back:c.a, note:""});
  });
  (d.mistakes||[]).forEach(function(m){
    deck.push({topic:t.id, topicName:t.name, kind:"抓錯", front:"這段哪裡錯？\n\n" + m.wrong, back:m.right, note:m.note});
  });
});

var activeFilter = "all";
var order = [];
var pos = 0;

function shuffle(arr){
  var a = arr.slice();
  for (var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}

function buildOrder(){
  var pool = deck.map(function(_,i){return i;}).filter(function(i){
    return activeFilter === "all" || deck[i].topic === activeFilter;
  });
  order = shuffle(pool);
  pos = 0;
}

var overlay = document.getElementById("overlay");
var deckFlip = document.getElementById("deckFlip");
var deckInner = document.getElementById("deckInner");

function renderDeckCard(){
  if (!order.length){ order=[0]; }
  var card = deck[order[pos]];
  deckFlip.classList.remove("flipped");
  document.getElementById("deckKindFront").textContent = card.topicName + " · " + card.kind;
  document.getElementById("deckFrontBody").textContent = card.front;
  document.getElementById("deckKindBack").textContent = card.kind === "抓錯" ? "正確寫法" : "語法";
  document.getElementById("deckBackBody").textContent = card.back;
  var noteEl = document.getElementById("deckNote");
  if (card.note){ noteEl.hidden = false; noteEl.textContent = card.note; }
  else { noteEl.hidden = true; }
  document.getElementById("progress").textContent = (pos+1) + " / " + order.length;
}

deckFlip.addEventListener("click", function(){ deckFlip.classList.toggle("flipped"); });
document.getElementById("prevBtn").addEventListener("click", function(){
  pos = (pos - 1 + order.length) % order.length; renderDeckCard();
});
document.getElementById("nextBtn").addEventListener("click", function(){
  pos = (pos + 1) % order.length; renderDeckCard();
});
document.getElementById("shuffleBtn").addEventListener("click", function(){
  buildOrder(); renderDeckCard();
});

var chipsEl = document.getElementById("chips");
var allChip = el("button", "chip mono", "全部");
allChip.type = "button"; allChip.setAttribute("aria-pressed","true");
allChip.addEventListener("click", function(){ setFilter("all", allChip); });
chipsEl.appendChild(allChip);
TOPICS.forEach(function(t){
  var c = el("button", "chip mono", t.name);
  c.type = "button"; c.setAttribute("aria-pressed","false");
  c.addEventListener("click", function(){ setFilter(t.id, c); });
  chipsEl.appendChild(c);
});
function setFilter(id, chipEl){
  activeFilter = id;
  Array.prototype.forEach.call(chipsEl.querySelectorAll(".chip"), function(c){ c.setAttribute("aria-pressed","false"); });
  chipEl.setAttribute("aria-pressed","true");
  buildOrder(); renderDeckCard();
}

document.getElementById("fabShuffle").addEventListener("click", function(){
  overlay.hidden = false;
  buildOrder();
  renderDeckCard();
});
document.getElementById("closeOverlay").addEventListener("click", function(){
  overlay.hidden = true;
});

})();
</script>
